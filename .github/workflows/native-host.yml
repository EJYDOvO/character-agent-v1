name: Native Host gates (DSH 0.2.2-rc.1)
# Verification branch only. An ephemeral Windows runner obtains the pinned
# public release and uses fresh Homes with synthetic QQ transport and model.
on:
  workflow_dispatch:
    inputs:
      qqtk_ref:
        description: QQTK commit or branch to test against
        required: true
        default: a7560247ce2d2ce107910e4f037b76c4e1baefa3
permissions:
  contents: read
concurrency:
  group: native-host
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      DSH_QQTK_PROJECT: ${{ github.workspace }}\qqtk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EJYDOvO/harness-qq-toolkit-public
          ref: ${{ inputs.qqtk_ref }}
          path: qqtk
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Locked dependencies
        shell: pwsh
        run: npm ci; if($LASTEXITCODE){exit $LASTEXITCODE}; Push-Location qqtk; npm ci; $c=$LASTEXITCODE; Pop-Location; exit $c
      - name: Interrupted switch orchestration on Windows PowerShell 5.1
        shell: powershell
        run: ./.github/scripts/verify-watchdog.ps1 $env:DSH_QQTK_PROJECT
      - name: Obtain and verify the pinned official test Host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $installer = Join-Path $env:RUNNER_TEMP 'dsh-0.2.2-rc.1-win-x64.exe'
          curl.exe --fail --location --silent --show-error --retry 3 --max-time 420 'https://download.deepseek.com/dsh-desk/bin/win-x64/deepseek-harness-0.2.2-rc.1-win-x64.exe' --output $installer
          if ($LASTEXITCODE -ne 0) { throw 'The official installer could not be downloaded.' }
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne '830947f8996dc05d991ca9133fff4d3400073e47b9cfa6507754867e79482b23') { throw 'Unexpected installer hash.' }
          $pin = Get-Content -Raw -LiteralPath docs/evidence/native-host-pin.json | ConvertFrom-Json
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or !$signature.SignerCertificate.Subject.Contains($pin.signerIncludes)) { throw 'Unexpected installer signature.' }
          $root = Join-Path $env:RUNNER_TEMP 'dsh-native-pinned'
          $staging = Join-Path $env:RUNNER_TEMP 'dsh-native-package'
          $archiver = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          $archive = $null
          if (Test-Path -LiteralPath $archiver) {
            & $archiver x $installer "-o$staging" '-ir!app-64.7z' -y | Out-Host
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $staging)) {
              $archive = Get-ChildItem -LiteralPath $staging -Filter 'app-64.7z' -File -Recurse | Select-Object -First 1
            }
          }
          if ($archive) {
            & $archiver x $archive.FullName "-o$root" -y | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'The pinned Host archive could not be extracted.' }
          } else {
            $installation = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$root") -Wait -PassThru
            if ($installation.ExitCode -ne 0) { throw "The pinned fixture installer exited with $($installation.ExitCode)." }
          }
          $env:DSH_CHARACTER_HOST_ROOT = $root
          $env:DSH_INSTALL_ROOT = $root
          node scripts/verify-host.cjs
          if ($LASTEXITCODE -ne 0) { throw 'The Host does not match the repository pin.' }
          "DSH_CHARACTER_HOST_ROOT=$root" >> $env:GITHUB_ENV
          "DSH_INSTALL_ROOT=$root" >> $env:GITHUB_ENV
          "DSH_CHARACTER_TEST_ROOT=$(Join-Path $env:RUNNER_TEMP 'dsh-native-homes')" >> $env:GITHUB_ENV
      - name: Verified Host and required native gates
        shell: pwsh
        run: ./scripts/run-native-gates.ps1 -Summary "$env:RUNNER_TEMP\native\summary.json"
      - name: Gate summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $f="$env:RUNNER_TEMP\native\summary.json"
          if(Test-Path $f){$s=Get-Content $f -Raw|ConvertFrom-Json;"Native verdict: $($s.verdict)"|Out-File -Append $env:GITHUB_STEP_SUMMARY;foreach($g in $s.gates){"- $($g.id): $($g.status)"|Out-File -Append $env:GITHUB_STEP_SUMMARY}}
          else{"Native verdict: not run (no summary)"|Out-File -Append $env:GITHUB_STEP_SUMMARY}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-gates
          path: ${{ runner.temp }}\native
