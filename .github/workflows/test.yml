name: Isolated regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Locked build dependencies
        run: npm ci
      - name: Unit and security regression (no credentials or production services)
        run: npm test
      - name: Audit reproductions
        if: ${{ !cancelled() }}
        run: npm run test:audit
      - name: Evidence metadata
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Node: $(node --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "OS: $RUNNER_OS. Test counts are in the unmodified test output above." >> "$GITHUB_STEP_SUMMARY"
          echo "Native Host gates: NOT RUN here (no DSH Host on hosted runners). See the Native Host gates workflow; absence is not a pass." >> "$GITHUB_STEP_SUMMARY"
