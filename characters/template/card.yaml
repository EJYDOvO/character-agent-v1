# ============================================================
# 角色卡模板（Character Card V3，YAML 写法）
#
# 结构和 CCv3 标准 JSON 完全一致，只是换成 YAML 写法：
# 可以一条命令导出成标准 JSON，在 SillyTavern 等工具里打开。
#
# 标记说明：
#   【生效】  会渲染进提示，影响角色表现
#   【不生效】DSH 目前忽略。为了导出后符合标准，保留空值即可
#
# 写法提示：
#   - 多行文本用「|」开头，下一行起缩进书写
#   - 用 {{char}} 指代角色，用 {{user}} 指代用户
#     构建时 {{char}} 替换成角色名，{{user}} 替换成「用户」
#   - 不要写其他 {{...}} 宏：构建时会被降级成 {...}，并给出警告
#   - 说话规则、身份约束不写在这里，写在同目录的 rules.md / reminder.md
#
# 长度：渲染后（含 rules.md 和 reminder.md）超过约 3000 token 会警告，
#       超过 8000 token 会构建失败。中文一个字约 0.6 token。
# ============================================================

spec: chara_card_v3
spec_version: "3.0"
data:
  # 【生效】角色名。渲染成标题「## 角色：<名字>」，并用来替换 {{char}}
  name: 示例角色

  # 【生效，可选】昵称。填写后，{{char}} 和标题都改用昵称
  nickname: ""

  # 【生效】核心描述：身份、外貌、背景、经历，以及和世界观相关的基本事实
  # 渲染在「## 角色：<名字>」标题下
  description: |
    {{char}}是……（身份、年龄、职业）
    外貌：……
    背景：……

  # 【生效】性格：性格特点、喜好厌恶、处事方式
  # 渲染在「## 性格」标题下
  personality: |
    ……

  # 【生效】场景：故事发生的环境、世界观，以及 {{char}} 和 {{user}} 的关系
  # 渲染在「## 场景」标题下
  scenario: |
    故事背景是……
    {{user}}是{{char}}的……，两人关系……

  # 【生效】对话示例：示范语气和风格，渲染在系统提示末尾
  # - 每段以 <START> 开头，段内一行一句
  # - 用 {{user}}: 和 {{char}}: 标明说话人
  # - 示例不会被当作真实发生过的对话
  mes_example: |
    <START>
    {{user}}: 你好，你叫什么名字？
    {{char}}: ……
    <START>
    {{user}}: ……
    {{char}}: ……

  # ---------- 以下【不生效】，保留空值即可 ----------

  # 开场白，以及备选开场白
  first_mes: ""
  alternate_greetings: []
  group_only_greetings: []

  # 卡自带的系统提示和末尾指令：DSH 一律忽略，填写了会在构建时警告
  # 规则请写进 rules.md / reminder.md
  system_prompt: ""
  post_history_instructions: ""

  # 作者备注和元数据：只供人看，不进提示
  creator_notes: ""
  creator: ""
  character_version: "1.0"
  tags: []

  # 扩展字段：DSH 目前不读取
  extensions: {}

  # 设定集：第二期才生效。第一期填写了只会警告，不起作用
  # character_book:
  #   entries: []
